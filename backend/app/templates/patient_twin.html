<div class="card">

<h2>Create Patient Digital Twin</h2>

<form

hx-post="/ui/digital-twin/patient"

hx-target="#result"

hx-swap="innerHTML"

>

<label>

Patient ID

</label>

<input
type="text"
name="patient_id"
required
>

<label>

Age

</label>

<input
type="number"
name="age"
required
>

<label>

Gender

</label>

<select name="gender">

<option>Male</option>

<option>Female</option>

</select>

<label>

Diagnosis

</label>

<input
type="text"
name="diagnosis"
>

<label>

Heart Rate

</label>

<input
type="number"
name="heart_rate"
>

<label>

Blood Pressure

</label>

<input
type="text"
name="blood_pressure"
>

<label>

Temperature

</label>

<input
type="number"
step="0.1"
name="temperature"
>

<label>

Weight

</label>

<input
type="number"
step="0.1"
name="weight"
>

<label>

Height

</label>

<input
type="number"
step="0.1"
name="height"
>

<br><br>

<button>

Create Twin

</button>

</form>

<hr>

<div id="result">

</div>

</div>
